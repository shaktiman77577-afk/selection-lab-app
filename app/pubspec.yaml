name: selection_lab
description: Selection Lab - Exam Preparation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  fluttertoast: ^8.2.4
  pinput: ^5.0.0
  razorpay_flutter: ^1.3.6
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  youtube_player_iframe: ^5.2.0
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
