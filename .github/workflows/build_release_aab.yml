name: Build Release AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/selectionlab-release.jks

      - name: Create key.properties
        run: |
          cat > app/android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=selectionlab-release.jks
          EOF

      - name: Get dependencies
        run: cd app && flutter pub get

      - name: Generate launcher icons
        run: cd app && dart run flutter_launcher_icons

      - name: Build signed AAB
        # Obfuscate: code padhna / mod banana mushkil (Oct 2026)
        run: cd app && flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      # Play ka 16 KB page size rule: har 64-bit .so ka LOAD alignment 16 KB (0x4000) ya zyada hona chahiye
      - name: Check 16 KB page size alignment
        run: |
          AAB=app/build/app/outputs/bundle/release/app-release.aab
          rm -rf so_check && mkdir so_check && unzip -q -o "$AAB" 'base/lib/*' -d so_check || true
          bad=0; count=0; list=""
          for f in $(find so_check -name '*.so' \( -path '*arm64-v8a*' -o -path '*x86_64*' \)); do
            count=$((count+1))
            min=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | while read a; do echo $((a)); done | sort -n | head -1)
            name="${f#so_check/base/lib/}"
            if [ "$min" -lt 16384 ]; then bad=$((bad+1)); list="$list$name=$min(BAD) "; else list="$list$name=$min "; fi
          done
          echo "Checked $count files: $list"
          if [ "$count" -eq 0 ]; then echo "::error title=16KB check::No 64-bit native libs found in AAB"; exit 1; fi
          if [ "$bad" -gt 0 ]; then echo "::error title=16KB check::$bad file(s) not 16 KB aligned: $list"; exit 1; fi
          echo "::notice title=16KB check::All $count native libs are 16 KB aligned: $list"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      # APK bhi banate hain taaki khud phone pe test kar sako (same signing)
      - name: Build signed APK (for your own testing)
        run: cd app && flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # Crash report ko padhne layak banane ke liye (obfuscate ke baad zaroori)
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: app/build/symbols
