name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fresh resolve
        run: |
          cd app && rm -f pubspec.lock && flutter pub get > ../pubget.log 2>&1 || echo "rc=$?" >> ../pubget.log
          tail -15 ../pubget.log
          python3 - <<'PY'
          import re
          import gzip,base64; t=base64.b64encode(gzip.compress(open('pubspec.lock','rb').read())).decode()
          parts=[t[i:i+3800] for i in range(0,len(t),3800)]
          for n,c in enumerate(parts):
              c=c.replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::warning title=LOCK{n}::{c}")
          PY
      - name: Icons (debug capture)
        run: |
          cd app && dart run flutter_launcher_icons > ../icons.log 2>&1 || echo "rc=$?" >> ../icons.log
          msg=$(tail -40 ../icons.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=ICONS::$msg"
      - name: Build (debug capture)
        run: |
          (cd app && flutter build apk --debug > ../first.log 2>&1 || true)
          cd app/android && chmod +x gradlew && ./gradlew assembleDebug --continue > ../../build.log 2>&1 || echo "rc=$?" >> ../../build.log; cd ../..
          msg=$(grep -E "^e: |error:|Execution failed for task|rc=" build.log | sed "s#/home/runner/.pub-cache/hosted/pub.dev/##" | cut -c1-260 | head -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=BUILD::$msg"
