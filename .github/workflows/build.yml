name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cd app && flutter pub get
      - run: cd app && dart run flutter_launcher_icons
      - run: cd app && flutter build apk --debug
      - name: Print SHA-1
        run: |
          cd app && flutter build apk --debug 2>/dev/null || true
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            2>/dev/null | grep "SHA1:" || echo "Not found"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
