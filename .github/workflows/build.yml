name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
      - run: cd app && flutter pub get 2>&1 | tee ../pubget.log
      - name: Icons (debug capture)
        run: |
          cd app && dart run flutter_launcher_icons > ../icons.log 2>&1 || echo "rc=$?" >> ../icons.log
          msg=$(tail -40 ../icons.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=ICONS::$msg"
      - name: Build (debug capture)
        run: |
          cd app && flutter build apk --debug > ../build.log 2>&1 || echo "rc=$?" >> ../build.log
          msg=$(grep -E "rror|xception|FAILURE|What went wrong|rc=" ../build.log | head -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=BUILD::$msg"
          msg2=$(grep -E "^\+? *[a-z_]+ [0-9]+\.[0-9]+" ../pubget.log | head -0)
